      state: available
      kind: runbook
      reference: 'docs/operations/process-frozen.md'
      preconditions: 'Read which process froze and how: the runner liveness check and storm:projection:status for a projection runner, the relay heartbeat checks for a relay, the broker''s queue for a consumer; pg_stat_activity for a backend of the frozen process left in a transaction, the locks it holds; record the projection''s status, lease and position and the supervisor''s view as the baseline; never read the lag for a frozen sole runner.'
      expected_result: 'The frozen process recycled first, then a runner frozen between cycles taken over by a second runner claiming its expired lease, the thawed one exiting clean on its lost lease; a runner frozen inside its checkpoint freed by its backend terminated or its process recycled, the takeover then running; a runner thawed unrescued resuming its own lease; a relay or a consumer recycled under its supervisor; nothing folded twice, no row rewritten by hand.'
    rehearsal:
      state: available
      reference: 'Storm Bank feature:process-frozen-recovery; merged revision 56dcf7fe183b4fc101991237ae1dcb2f4497d1f3, coordination issues 508 and 528.'
      initial_state: 'Exclusive disposable checkout, PostgreSQL, RabbitMQ and Redis; the read-model database created before the run, the guarded entry checking isolation before the reset that would create it; reserved smoke_process_frozen_ schema, the events in sync, no resident workers or PostgreSQL clients, a drained seed baseline with the balance projection at the head.'
      hypothesis: 'A projection daemon stopped by a signal without exiting keeps its process and its running status while its heartbeat stops and its lease expires; the lag reads zero over what it leaves unfolded, the safe-head floor being ratcheted by the frozen runner''s own tick, while the store''s head shows the gap; thawed with its lease unclaimed it resumes its own lease and folds the gap; a second runner claims the expired lease and catches up, and the thawed daemon exits non-zero on its lost lease, naming the hand-off and tying that exit to the supervisor, without moving the position, marking the projection failed or taking the lease back, the new owner then folding what lands after it; a runner frozen inside its checkpoint holds the row lock, the takeover blocks on it, and only the backend terminated frees it.'
      injection: 'Start the balance projection as a daemon under a three-second lease as owner frozen-to-be, fold five deposits; SIGSTOP the daemon, five more deposits, one TTL plus a second; SIGCONT with the lease unclaimed; SIGSTOP again, a rescue runner in drain mode, SIGCONT; five deposits after the hand-off and the rescue runner again; then a stand-in session holding the checkpoint row FOR UPDATE in an open transaction, five deposits, a rescue runner bounded to eight seconds, pg_terminate_backend on the holder, a rescue runner again.'
      observation: 'Frozen: process alive, status running, lease owner unchanged, lease expired, heartbeat older than the TTL, balance unmoved, lag zero over a gap of five events. Thawed unrescued: the deposits folded, the process alive, the lease live again under the same owner. Rescued: the rescue exits zero, the balance carries every deposit, the gap zero; the thawed daemon exits 1 within thirty seconds, its output naming the hand-off, another worker claiming its lease mid-run, and saying the non-zero exit is what makes a supervisor relaunch it, the position and the balance unchanged, the status not failed, the lease not taken back; the new owner then folds the five deposits that land after the hand-off and reaches the head. Locked: the bounded rescue times out folding nothing; terminated, the next rescue folds the five and reaches the head.'
      recovery: 'Run make process-frozen-recovery in the provisioned Bank checkout with PROCESS_FROZEN_DATABASE_HOST, PROCESS_FROZEN_BROKER_HOST and MESSENGER_EVENTS_DSN=sync:// declared. The exit-zero-expected variant must fail on the exit the runner gives; the takeover-omitted variant must fail at the thaw, the daemon still running; the freeze-omitted variant must fail on the lease still live. A stop signal never lands inside a transaction on cue, hence the stand-in session. The takeover is a drain runner that has released its lease by the time the frozen one thaws, so the thawed daemon finds no owner rather than another one; the runner raises LeaseLost and exits non-zero either way.'
      cleanup: 'bin/process-frozen-smoke.sh takes a per-schema lock, resets the reserved schema before the run, thaws and stops the daemon on any exit, and drops the schema and the queues after, unsuccessful runs included.'
