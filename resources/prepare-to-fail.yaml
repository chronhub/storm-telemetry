classes:
  -
    id: append-conflict
    title: 'Expected-version append conflict'
    prevention:
      state: available
      kind: code
      reference: src/Chronicler/Exception/ConcurrencyException.php
    detection:
      state: available
      kind: structured_log
      reference: 'Storm\Telemetry\StormObservability::recordOccConflict; storm.event_store.occ_conflict; stale conflicts at info, duplicate versions at warning'
    resolution:
      state: available
      kind: runbook
      reference: 'docs/operations/append-conflict.md'
      preconditions: 'Read storm.event_store.occ_conflict by kind and by stream: a stale line is a lost race the forward retry absorbs, a duplicate is poison that dead-letters at once; tell a converging stream from a hot one whose losers keep losing; never read an empty queue as convergence while losers wait on their delay.'
      expected_result: 'The stream''s version reaches the work aimed at it, one append per command, the effect exact at its target; no duplicate and no dead letter on the stream; the stale rate back to the background once the burst passed, or the contention treated as a design fact.'
    rehearsal:
      state: available
      reference: 'Storm Bank feature:append-conflict-recovery; merged revision 1c70b596536aaa03d2fe84a482daa7ddc8fd69e9, coordination issue 496.'
      initial_state: 'Exclusive disposable checkout, PostgreSQL, RabbitMQ and Redis; reserved smoke_append_conflict_ schema, synchronous event delivery, no resident workers or PostgreSQL clients, a drained seed baseline, and the Storm log offset recorded so only what the burst writes is read.'
      hypothesis: 'Concurrent commands on one stream lose races that the store types as retryable and the sink logs as stale, the forward retry re-decides against the advanced stream, and the stream converges to exactly one append per command with no duplicate and no dead letter.'
      injection: 'Dispatch forty 100-cent DepositCashMoney commands on one account through the command bus, assert nothing appended, then run four messenger:consume processes at once on the queue for a bounded time without the bench drained-stop.'
      observation: 'The Storm log carries storm.event_store.occ_conflict records of kind stale at INFO on the account stream, at least one, and none of kind duplicate; the count is stochastic and not bounded above. No message failed. The stream carries exactly forty more deposits, the command queue is empty and the balance carries exactly the burst; a second pass of two workers changes nothing.'
      recovery: 'Run make append-conflict-recovery in the provisioned Bank checkout with APPEND_CONFLICT_DATABASE_HOST, APPEND_CONFLICT_BROKER_HOST and MESSENGER_EVENTS_DSN=sync:// declared. The recovery is the workers living past the retry''s capped jittered delay; the single-worker and burst-not-consumed variants must fail. A drained-stop that reads the queue empty while losers wait on the delay exchange stops short of convergence, which the runbook records.'
      cleanup: 'The guarded wrapper bin/append-conflict-smoke.sh holds a per-schema lock, refuses any schema outside smoke_append_conflict_, resets before and drops after on any exit, preserving the original failure, and verifies the disposable resources are clean. Retire dedicated containers after preserving evidence.'
  -
    id: poison-message
    title: 'Permanently failing message handler'
    prevention:
      state: not_applicable
      reason: 'A handler that throws on every delivery is an application defect the framework cannot prevent from being written or deployed; what it does is contain it: the failure taxonomy tells poison from transient, the batched consumer rolls the batch back, replays per message and captures the poison alone, the failure transport holds it for an operator''s verdict, and no innocent is lost or applied twice. Declaring a failure unrecoverable or recoverable is the application''s own contract.'
      decision: 'Operations plan 377, decision 10134.'
    detection:
      state: available
      kind: healthcheck
      reference: 'Storm\Symfony\Health\FailedMessagesHealthCheck::check(), failed_messages, wired for the transport storm.inbox.failure_transport names: Degraded from the first captured message, naming messenger:failed:show, :retry and :remove; Ok with its reason when the transport cannot count. Metric storm_failed_messages{transport}, no sample when it cannot count. Log token storm.story.batch_isolated at warning, the one trace of a batch rolled back and replayed per message, with the batch size and what the replay condemned, redelivered and acked. Unit-qualified on a counting transport; no alert delivery claimed.'
    resolution:
      state: available
      kind: runbook
      reference: 'docs/operations/poison-message.md'
      preconditions: 'Read the failure transport, not the queues: messenger:failed:show for the error class, the origin and the redelivery count; tell a handler bug from an undecodable type, a wrong payload and a wait that never cleared; record ids and the aggregate named before changing anything.'
      expected_result: 'Replayed once the fix shipped, the message''s effect observed once at its target and the failure transport empty for its id; or purged on a recorded verdict; no new capture with the same error follows.'
    rehearsal:
      state: available
      reference: 'Storm Bank feature:poison-message-recovery; merged revision 3b157736690abadb36d7a1222683b50520934493, coordination issue 497.'
      initial_state: 'Exclusive disposable checkout, PostgreSQL, RabbitMQ and Redis; reserved smoke_poison_message_ schema, the events lane on the disposable broker rather than sync, no resident workers or PostgreSQL clients, a drained seed baseline with an empty failure transport, and the application log offset recorded so only what the run writes is read.'
      hypothesis: 'A handler that throws the unrecoverable kind on one event poisons that message alone: the batch it lands in is rolled back and replayed per message, the poison captured once with no redelivery, the innocents committed; replay once the fix ships and purge on a verdict each leave the failure transport empty.'
      injection: 'Rename an identity to the hard-poison marker of PoisonHandlerProbe and dispatch fifteen 100-cent deposits through the command bus, consume the commands, relay the events, then run storm:bus:consume-batched on the events lane in batches of sixteen, once.'
      observation: 'Exactly one message on the failure transport, its body naming UnrecoverableMessageHandlingException with a redelivery count of zero; fifteen ledger reactions committed; the consumer''s storm.story.batch_isolated line for one batch of sixteen, one condemned, none redelivered, fifteen acked. Recovery one, messenger:failed:retry under the probe''s disarming flag on the replaying process alone, reports the transport handled and leaves it empty with no effect duplicated; recovery two, a second poison captured then messenger:failed:remove on its id, leaves it empty; a final drain captures nothing.'
      recovery: 'Run make poison-message-recovery in the provisioned Bank checkout with POISON_MESSAGE_DATABASE_HOST and POISON_MESSAGE_BROKER_HOST declared. The marker-not-armed, batch-of-one and replay-omitted variants must fail.'
      cleanup: 'The guarded wrapper bin/poison-message-smoke.sh holds a per-schema lock, refuses any schema outside smoke_poison_message_, resets before and drops after on any exit, preserving the original failure, and verifies the disposable resources are clean. Retire dedicated containers after preserving evidence.'
  -
    id: duplicate-delivery
    title: 'Duplicate message delivery'
    prevention:
      state: available
      kind: code
      reference: 'Storm\Story\Middleware\DeduplicateConsumer with Storm\Chronicler\Inbox\DbalInboxStore::once(): the (consumer, message_id) mark and the handler''s effects commit in one transaction on the default connection, a redelivery is absorbed by the named conflict target and runs no handler; sagas dedupe by correlation and a broker send inside the inbox transaction is refused at the sender seam unless signed. Effects outside that connection stay at-least-once by contract.'
    detection:
      state: available
      kind: structured_log
      reference: 'Storm\Chronicler\Inbox\DbalInboxStore::once(); storm.chronicler.inbox_duplicate at info with the consumer, the message id and the row''s count; the es_inbox row keeps duplicates and last_duplicate_at; metrics storm_inbox_duplicates_skipped and storm_inbox_duplicate_rows beside storm_inbox_rows. The batched path, DbalBatchInboxStore::onceBatch(), skips its duplicates without counting them yet. A duplicate that BYPASSES the inbox leaves no trace here by construction: an effect applied twice is read on the affected aggregate or read model, not on the inbox.'
    resolution:
      state: available
      kind: runbook
      reference: 'docs/operations/duplicate-delivery.md'
      preconditions: 'Read the es_inbox rows with duplicates > 0 and the two gauges before judging the count; tell the redelivery the inbox absorbed, which needs no repair, from the duplicate that bypassed it, read on the effect: an id minted afresh, a lane without the inbox, an effect outside the inbox transaction; look for the aggregate''s own reference key, which absorbs a duplicate without any trace.'
      expected_result: 'An absorbed redelivery left alone, its producer stopped when the count climbs on a quiet system; a duplicate that reached an effect corrected by a compensating fact recorded once, or a read model rebuilt; a redelivery after the fix absorbed and counted, not applied.'
    rehearsal:
      state: available
      reference: 'Storm Bank feature:duplicate-delivery-recovery; merged revision b2b74b97c40e94d63b0b866a550cdead9c86d988, coordination issue 498.'
      initial_state: 'Exclusive disposable checkout, PostgreSQL, RabbitMQ and Redis; reserved smoke_duplicate_delivery_ schema, the events in sync and the command lane on the disposable broker, no resident workers or PostgreSQL clients, a drained seed baseline with nothing absorbed on es_inbox and both inbox gauges at zero, and the application log offset recorded so only what the run writes is read.'
      hypothesis: 'A command delivered twice under one message id moves money once: the inbox absorbs the redelivery, counts it on its row, logs it and the metrics sum it. The same command under a fresh message id is invisible to the inbox, and the aggregate takes it as a no-op on its own hold reference, recording nothing.'
      injection: 'Start a transfer, consume its command so the saga publishes the hold, set the published saga outbox row back to pending with its stored header and relay it again, so the command lane carries the hold twice under one message id; consume the lane. Then set it back once more with a fresh __message_id, relay and consume.'
      observation: 'bank.funds_held once; the es_inbox row of the async consumer at duplicates 1 with last_duplicate_at set, the only row touched; exactly one storm.chronicler.inbox_duplicate line since the baseline naming that consumer, that message id and a count of one; storm_inbox_duplicates_skipped and storm_inbox_duplicate_rows at one; the transfer at done with one capture and the count unchanged through the completing rounds. Under the fresh id: the count unchanged, the hold still once, the account stream''s version unchanged.'
      recovery: 'Run make duplicate-delivery-recovery in the provisioned Bank checkout with DUPLICATE_DELIVERY_DATABASE_HOST and DUPLICATE_DELIVERY_BROKER_HOST declared. The republish-omitted and id-rewritten variants must fail on the count.'
      cleanup: 'The guarded wrapper bin/duplicate-delivery-smoke.sh holds a per-schema lock, refuses any schema outside smoke_duplicate_delivery_, resets before and drops after on any exit, preserving the original failure, and verifies the disposable resources are clean. Retire dedicated containers after preserving evidence.'
  -
    id: projection-stalled
    title: 'Lagging or stopped projection'
    prevention:
      state: not_applicable
      reason: 'Projection lag is a scheduling and capacity property of the deployment (the runner process, its lease, its scheduling, the load), not a failure the framework can prevent; the single cursor and checkpoint-together guarantees prevent skipping, which is the corruption, and the safe-head grace with the transaction_timeout warning of storm:install keeps slow writers out of the reader''s path.'
      decision: 'Operations plan 377, decision 9996.'
    detection:
      state: available
      kind: structured_log
      reference: 'Storm\Telemetry\StormObservability::recordBatch; storm.projector.batch; empty scans are silent and do not prove liveness. storm_projection_lag measures against the safe-head floor event_store_high_water, which only a running projection tick advances: with every runner stopped the floor stands still and the metric reads 0 while the store is ahead (rehearsal on coordination issue 499). A stopped fleet is detected by the age of each projection heartbeat and by the gap between max(sequence_no) and the floor, not by the lag alone.'
    resolution:
      state: available
      kind: console
      reference: 'storm:projection:retry'
      preconditions: 'The projection has failed and its underlying fault has been corrected. Inspect its status first. This preserves the checkpoint; it does not rebuild corrupted output.'
      expected_result: 'The failed projection is re-armed at its retained checkpoint; verify progress separately.'
    rehearsal:
      state: available
      reference: 'Storm Bank feature:projection-lag-recovery; merged revision 4dacfdd35c3ef3fff124770a26bb132e7d3839a4, coordination issue 499.'
      initial_state: 'Exclusive disposable checkout, PostgreSQL, RabbitMQ and Redis; reserved smoke_projection_lag_ schema, synchronous event delivery, no resident workers or PostgreSQL clients, and a drained seed baseline with every projection at the safe head.'
      hypothesis: 'Withholding one projection runner while events are delivered leaves the store ahead of that read model, the projection idle rather than failed, and its published lag silent until any runner advances the floor; one bounded drain restores the read model.'
      injection: 'Produce, consume and deliver three 100-cent bank:deposit commands with the rm_account_balance runner withheld; assert nothing is pending or failed and the store grew by exactly six events, the deposits and their ledger reactions.'
      observation: 'The account balance is unchanged and the projection status is idle. The safe head and storm_projection_lag both read 0 with no runner ticking. Running rm_ledger_balance moves the floor and the lag reads exactly six, the floor minus the checkpoint, while the account read model still has not moved.'
      recovery: 'Run make projection-lag-recovery in the provisioned Bank checkout with PROJECTION_LAG_DATABASE_HOST, PROJECTION_LAG_BROKER_HOST and MESSENGER_EVENTS_DSN=sync:// declared. The scenario runs storm:projection:run rm_account_balance --drain once; the balance gains exactly 300 cents and the lag reads 0; a second drain changes nothing. The runner-not-withheld, recovery-omitted and floor-unmoved variants must fail.'
      cleanup: 'The guarded wrapper bin/projection-lag-smoke.sh holds a per-schema lock, refuses any schema outside smoke_projection_lag_, resets before and drops after on any exit, preserving the original failure, and verifies the disposable resources are clean. Retire dedicated containers after preserving evidence.'
  -
    id: saga-waiting
    title: 'Saga stuck waiting'
    prevention:
      state: not_applicable
      reason: 'A saga waits for an event another party must produce, and the framework cannot prevent that event from never coming; what it does is bound every wait by what the application declares for it, the heartbeat that escalates without finalizing an effect-gating wait and the global deadline that halts or waives, and make the wait visible by state and idle time. A wait nobody bounded is the application''s declaration, not a framework failure.'
      decision: 'Operations plan 377, decision 10062.'
    detection:
      state: available
      kind: console
      reference: 'storm:saga:list; storm:saga:inspect; operator inspection is not an autonomous liveness alert'
    resolution:
      state: available
      kind: console
      reference: 'storm:saga:unpark'
      preconditions: 'Inspect the parked saga and correct its poison timer or handler first. Unparking does not redrive an arbitrary dead-lettered command.'
      expected_result: 'The parked saga is eligible to resume; verify its next transition separately.'
    rehearsal:
      state: available
      reference: 'Storm Bank feature:saga-waiting-recovery; merged revision 4a14f8f77f331571d8a4a502e48d1d056d7dab0d, coordination issue 500.'
      initial_state: 'Exclusive disposable checkout, PostgreSQL, RabbitMQ and Redis; reserved smoke_saga_waiting_ schema, synchronous event delivery, no resident workers or PostgreSQL clients, and a drained seed baseline with no pending event or saga command.'
      hypothesis: 'A saga whose awaited event never comes stays running at its wait and escalates on its heartbeat without failing, the operator listing finds it, and delivering the event is the whole recovery.'
      injection: 'Start one 1000-cent bank:transfer, relay and execute its hold, then withhold the event relay; assert the saga at await_hold and running, exactly one bank.funds_held pending in es_outbox, and no saga command pending.'
      observation: 'storm:saga:list names the waiting saga and the by-state count shows it; the aged await_hold heartbeat fired by storm:saga:timers leaves the saga at the same state and status with its heartbeat re-armed within the declared interval; no balance moved. The SagaAwaitEscalated announcement rides the telemetry lane and is not asserted here; it is covered by the framework''s unit tests. Recovery must leave no pending event, no open transfer saga, exactly 1000 cents moved once; a second drain changes nothing.'
      recovery: 'Run make saga-waiting-recovery in the provisioned Bank checkout with SAGA_WAITING_DATABASE_HOST, SAGA_WAITING_BROKER_HOST and MESSENGER_EVENTS_DSN=sync:// declared. The scenario runs storm:outbox:relay once to deliver the event, then the saga relay, the consumer and the event relay in at most four rounds. The event-relay-not-withheld, recovery-omitted and heartbeat-not-fired variants must fail.'
      cleanup: 'The guarded wrapper bin/saga-waiting-smoke.sh holds a per-schema lock, refuses any schema outside smoke_saga_waiting_, resets before and drops after on any exit, preserving the original failure, and verifies the disposable resources are clean. Retire dedicated containers after preserving evidence.'
  -
    id: event-outbox-lag
    title: 'Event outbox relay lag'
    prevention:
      state: not_applicable
      reason: 'Relay lag is an availability property of the deployment, the draining process, its scheduling, the broker and capacity, not a failure the framework can prevent; it guarantees no loss and no reordering, detects lag and bounds its recovery.'
      decision: 'Operations plan 377, decision 9969.'
    detection:
      state: available
      kind: healthcheck
      reference: 'Storm\Telemetry\Health\OutboxLivenessHealthCheck::check(), outbox_liveness. Local event-database probe qualified before and after recovery; no alert delivery or production-threshold calibration claimed. See docs/operations/outbox-lag.md.'
    resolution:
      state: available
      kind: runbook
      reference: 'docs/operations/outbox-lag.md'
      preconditions: 'Verify the application database, schema, runtime, transport and worker ownership; record the affected event cohort and resolve the diagnosed cause before draining.'
      expected_result: 'The affected pending cohort is cleared, no unresolved failed or stalled rows remain, and downstream receipts and business observations confirm delivery; a successful command exit alone is insufficient.'
    rehearsal:
      state: available
      reference: 'Storm Bank feature:outbox-lag-recovery; merged revision 2eba7479c7812e943c8e537a9c2d55ba307373a3, coordination issue 513.'
      initial_state: 'Exclusive disposable checkout, PostgreSQL, RabbitMQ and Redis; reserved smoke_outbox_lag_ schema, consistent Symfony and Make broker configuration, no resident workers, and a drained seed baseline.'
      hypothesis: 'Withholding the event relay retains deposit events and delays their ledger reactions; bounded recovery restores the expected business effects.'
      injection: 'Produce and consume three 100-cent bank:deposit commands without relaying their events; assert the three pending positions belong to those deposits.'
      observation: 'Pending cohort remains present while ledger effects are absent. Recovery must produce exactly 300 additional cents in the account, cash and deposit-liability balances and exactly three ledger events, with no pending or failed work. A second drain leaves these results unchanged.'
      recovery: 'Run make smoke-all ONLY=outbox-lag-recovery SMOKE_SCHEMA=smoke_outbox_lag_demo in the provisioned Bank checkout. The scenario invokes the real event relay with batch 100 for at most three rounds; event handlers execute synchronously on publication. Omitted recovery and premature-drain variants must fail.'
      cleanup: 'The guarded wrapper resets and removes its disposable schemas and queues on success or failure, preserving the original failure. The existing reset also clears checkout caches, logs and sibling _logs; all must belong to the disposable workspace. Inspect failed cleanup before reuse and retire dedicated resources after preserving evidence.'
  -
    id: idle-outbox-dead
    title: 'Dead event relay on an idle system'
    prevention:
      state: not_applicable
      reason: 'A relay''s life belongs to the deployment''s supervisor, which restarts, recycles and logs its exit; the framework cannot keep a process alive, and prevents nothing here. What it does is make the death visible with no work to relay: the heartbeat every drain writes, the outbox_relay_liveness check and the tick-age metric, and the runbook that tells dead from idle.'
      decision: 'Operations plan 377, decision 10016.'
    detection:
      state: available
      kind: healthcheck
      reference: 'Storm\Telemetry\Health\OutboxRelayLivenessHealthCheck::check(), outbox_relay_liveness, read from es_outbox_relay, the heartbeat every drain of storm:outbox:relay upserts whether or not it found work; Degraded with no heartbeat or when the freshest is older than the threshold, 300 seconds by default. Metric storm_outbox_relay_tick_age_seconds, no sample before the first tick. Local qualification on an empty outbox in the integration suite; no alert delivery or production-threshold calibration claimed.'
    resolution:
      state: available
      kind: runbook
      reference: 'docs/operations/relay-silence.md'
      preconditions: 'Read the heartbeat, outbox_relay_liveness or es_outbox_relay, to tell a dead relay from an idle one, a wedged process from an absent one, and a relay that never ran from one that stopped; verify the database and schema the relay and the writers share; a green backlog signal establishes nothing here.'
      expected_result: 'The relay runs again under its supervisor: the heartbeat age falls below the threshold, outbox_relay_liveness answers Ok naming the last tick and keeps doing so on following samples; one hand-run drain proves one tick, not a living relay. Work that arrived during the silence is verified by the backlog runbook.'
    rehearsal:
      state: available
      reference: 'Storm Bank feature:relay-silence; merged revision 66e8d85788a67f09efb31d35b7359313a20b54ac, coordination issue 502.'
      initial_state: 'Exclusive disposable checkout, PostgreSQL, RabbitMQ and Redis; reserved smoke_relay_silence_ schema, synchronous event delivery, no resident workers or PostgreSQL clients, and a drained seed baseline whose relay has just ticked with a relayed total above zero.'
      hypothesis: 'A relay that never runs again on an idle outbox is invisible to the backlog signals and visible to its heartbeat, and one relay run is the whole recovery.'
      injection: 'Let a few seconds pass with no relay run and no work; assert nothing became pending or failed.'
      observation: 'outbox_liveness reads Ok and storm_outbox_events_oldest_pending_age_seconds reads 0 while the relay is dead; storm_outbox_relay_tick_age_seconds climbs with the silence; outbox_relay_liveness at its default threshold still reads Ok, the accepted blind window, and at a two-second threshold reads Degraded naming the last tick and the threshold.'
      recovery: 'Run make relay-silence in the provisioned Bank checkout with RELAY_SILENCE_DATABASE_HOST, RELAY_SILENCE_BROKER_HOST and MESSENGER_EVENTS_DSN=sync:// declared. The scenario runs storm:outbox:relay once; the heartbeat age falls under the threshold, the check reads Ok, the relayed total is unchanged and nothing is pending. The relay-not-silent and restart-omitted variants must fail.'
      cleanup: 'The guarded wrapper bin/relay-silence-smoke.sh holds a per-schema lock, refuses any schema outside smoke_relay_silence_, resets before and drops after on any exit, preserving the original failure, and verifies the disposable resources are clean. Retire dedicated containers after preserving evidence.'
  -
    id: saga-command-outbox
    title: 'Saga command outbox lag'
    prevention:
      state: not_applicable
      reason: 'Saga command relay lag is an availability property of the deployment, the draining process, its scheduling, the command bus and capacity, not a failure the framework can prevent; it guarantees no lost and no doubly sent command, detects lag and dead letters, and bounds the recovery.'
      decision: 'Operations plan 377, decision 10043.'
    detection:
      state: available
      kind: healthcheck
      reference: 'Storm\Telemetry\Health\SagaOutboxLivenessHealthCheck::check(), saga_outbox_liveness, the twin of outbox_liveness over workflow_outbox: Degraded first on failed rows, naming storm:saga:inspect and storm:saga:redrive, then on the oldest pending command older than the threshold, 300 seconds by default; Ok with its reason when the saga module is not installed. Metric storm_saga_outbox_oldest_pending_age_seconds, 0 when none. Local qualification in the integration suite; no alert delivery or production-threshold calibration claimed.'
    resolution:
      state: available
      kind: runbook
      reference: 'docs/operations/saga-outbox-lag.md'
      preconditions: 'Verify the application database, schema, runtime, command bus and relay ownership; tell lag from an operator freeze, whose pending rows the relay leaves unclaimed on purpose, and from back-off; record the affected correlations; for a failed row, inspect the saga and its evidence before any redrive, whose four guards decide.'
      expected_result: 'The affected pending cohort is dispatched and the sagas left the state that issued the commands; no unresolved failed row remains; each command''s business effect is observed exactly once from its target, never from a published row; a zero exit alone is insufficient.'
    rehearsal:
      state: available
      reference: 'Storm Bank feature:saga-outbox-lag-recovery; merged revision cd91a5cc860dd890e79d368b91bd1b34598c1fb6, coordination issue 503.'
      initial_state: 'Exclusive disposable checkout, PostgreSQL, RabbitMQ and Redis; reserved smoke_saga_outbox_lag_ schema, synchronous event delivery, no resident workers or PostgreSQL clients, and a drained seed baseline with no pending or failed saga command and saga_outbox_liveness reading Ok.'
      hypothesis: 'Withholding the saga command relay holds a transfer at its first step with its hold command pending, degrades the saga outbox check, and bounded recovery carries the transfer to its end exactly once.'
      injection: 'Start one 1000-cent bank:transfer and consume its command without running storm:saga:relay; assert exactly one pending command, the transfer saga''s, and the saga at await_hold.'
      observation: 'No balance moved; saga_outbox_liveness reads Degraded naming the oldest pending saga command; no dead letter anywhere. Recovery must leave no pending command and no open transfer saga, read Ok with its healthy message, and move exactly 1000 cents from source to destination once; a second recovery leaves everything unchanged.'
      recovery: 'Run make saga-outbox-lag-recovery in the provisioned Bank checkout with SAGA_OUTBOX_LAG_DATABASE_HOST, SAGA_OUTBOX_LAG_BROKER_HOST and MESSENGER_EVENTS_DSN=sync:// declared. The scenario runs storm:saga:relay, the command consumer and storm:outbox:relay in at most four rounds for the transfer''s three legs. The relay-not-withheld and recovery-omitted variants must fail.'
      cleanup: 'The guarded wrapper bin/saga-outbox-lag-smoke.sh holds a per-schema lock, refuses any schema outside smoke_saga_outbox_lag_, resets before and drops after on any exit, preserving the original failure, and verifies the disposable resources are clean. Retire dedicated containers after preserving evidence.'
  -
    id: broker-unavailable
    title: 'AMQP broker unavailable'
    prevention:
      state: not_applicable
      reason: 'A broker that stops answering is an availability property of the deployment, its node, its network, its credentials, which the framework cannot prevent; what it guarantees is that the outage withholds and never loses: events and their publication intent commit together in the append transaction, saga commands land in their outbox, and the relays retry with a back-off once the broker is back. The relays never turn the outage into an operator''s replay: a publish failure whose cause chain names the transport, the connection or the database is never dead-lettered, whatever the attempt count, so a withheld row waits in its outbox while both consoles exit non-zero.'
      decision: 'Operations plan 377, decision 10302.'
    detection:
      state: available
      kind: healthcheck
      reference: 'Storm\Symfony\Health\EventsTransportHealthCheck::check(), events_transport, wired for the transport storm.outbox.events_transport names: Ok with the queued count when the broker answers, Degraded naming the exception class when it does not, the write path never depending on the broker, Ok with its reason when the transport cannot count. Storm\Telemetry\Health\OutboxPublishHealthCheck::check(), outbox_publish: Degraded from the first pending row of es_outbox or workflow_outbox that failed a publish, naming each relay''s count and its own last error; dead letters stay the liveness checks'' business. Gauges storm_outbox_events_backing_off and storm_saga_outbox_backing_off. Log tokens storm.outbox.publish_failed and storm.saga.publish_failed at warning, with the partition or the correlation, the attempt and the budget. The attempt budget never dead-letters a withheld row, a publish failure naming the transport, the connection or the database keeping its row pending whatever the count, so a failed row under an outage is a poison the outage exposed; storm:outbox:relay and storm:saga:relay both exit non-zero on the same stopped-on-a-publish-error line, carrying the counts they committed first. Unit-qualified on a counting transport and integration-qualified on real outboxes; no alert delivery claimed.'
    resolution:
      state: available
      kind: runbook
      reference: 'docs/operations/broker-unavailable.md'
      preconditions: 'Read the broker through events_transport and the attempts through outbox_publish before the backlog checks, which stay Ok inside their threshold; record the pending and failed counts of both outboxes as the baseline; a failed row appearing under the outage is a poison the outage exposed and never the outage itself, since a transport failure keeps its row pending.'
      expected_result: 'The broker answering, the relays draining their pending tails in order and exiting zero, the consumers back, every withheld effect observed once at its target, no pending older than the recovery and no failed row; a row the outage exposed as poison replayed by its own procedure, storm:outbox:failed --retry for an event and storm:saga:redrive under its four guards for a command.'
    rehearsal:
      state: available
      reference: 'Storm Bank feature:broker-unavailable-recovery; merged revision f756aaea61ad7c2f6ac5525597c97a7c5129ec33, coordination issues 504 and 529.'
      initial_state: 'Exclusive disposable checkout, PostgreSQL, RabbitMQ and Redis; the read-model database created before the run; reserved smoke_broker_unavailable_ schema, every lane on the disposable broker, no resident workers or PostgreSQL clients, a drained seed baseline with both outboxes clean and the events queue empty.'
