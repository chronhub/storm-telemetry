      reference: 'Storm\Symfony\Health\FailedMessagesHealthCheck::check(), failed_messages, Degraded from the first captured message, with storm_failed_messages{transport} stepping from the deploy and the storm.story.batch_isolated log token per rolled-back batch; storm_projection_status{status=failed} for a projection whose apply throws; SagaHalted announcements and storm:saga:list for the workflows; outbox_publish and storm:outbox:failed for a lane the new binary stalls. A green pipeline says nothing about production: these read what the regressed binary touches from its first message. What they do not read: a regression that computes a wrong state without throwing, and a regression at the ingress refusing valid requests before the bus, the application''s reconciliations and ingress monitors'' to read. Qualified by the Bank rehearsal on the failure transport and its health check; no alert delivery claimed.'
    resolution:
      state: available
      kind: runbook
      reference: 'docs/operations/delivery-regression.md'
      preconditions: 'Read the deploy log for the lot and the previous binary, then the signals for what it broke, the failure transport, the failed projections, the halted or parked sagas, the stalled lanes, and the gates against the running binary; record them as the baseline; take the database''s snapshot and export the failure transport before a projection reset or a bulk replay; never purge the failure transport, never fix forward by hand in production, never edit a stored row to fit the regressed binary.'
      expected_result: 'The previous binary redeployed in the deploy''s order, stop, drain, swap, reopen; the captured messages replayed once under it and their effects observed once; the failed projections retried from their checkpoint or rebuilt from the store; the parked sagas unparked, the dead-lettered commands redriven, the halted ones reclaimed and re-issued; the stalled lanes resumed by the relay''s net; the lot back to review with its regression proven by a named red test.'
    rehearsal:
      state: available
      reference: 'Storm Bank feature:delivery-regression-recovery; merged revision 2561bdc05c5e59cc4eb773a307310294529b5aec, coordination issue 511.'
      initial_state: 'Exclusive disposable checkout, PostgreSQL, RabbitMQ and Redis; reserved smoke_delivery_regression_ schema, no resident workers or PostgreSQL clients, the world drained under the binary that was in production, the failure transport empty and its health check Ok, the ledger counted.'
      hypothesis: 'A lot merged behind a green pipeline ships a reaction that throws the unrecoverable kind on every valid deposit: nothing before production reads it; from the first message after the deploy the batched consumer captures each deposit to the failure transport, its batch rolled back so no ledger leg lands, no redelivery, and the failure transport''s health check degrades naming the count; the previous binary back, the captured deposits replay once, every leg landing exactly once, the check Ok again, a second drain moving nothing.'
      injection: 'The regressed binary is the same code run as subprocesses under REHEARSAL_REGRESSION=deposit, read by a sandbox reaction on the deposit event that throws UnrecoverableMessageHandlingException; the corrected binary is the same subprocess with the variable cleared; the outbox relay and every lane consumer run as subprocesses; five deposits are recorded, relayed and consumed by the regressed binary, then messenger:failed:retry runs under the corrected one.'
      observation: 'Five deposits recorded by the command side, five captured on the failure transport with no ledger leg written and zero redeliveries, failed_messages Degraded naming five messages; the replay under the corrected binary reported every message handled, zero captured, exactly five ledger legs more than the baseline, failed_messages Ok; a second drain captured nothing and wrote nothing, the check still Ok.'
      recovery: 'Run make delivery-regression-recovery in the provisioned Bank checkout with DELIVERY_REGRESSION_DATABASE_HOST and DELIVERY_REGRESSION_BROKER_HOST declared. The regression-omitted, revert-omitted and Degraded-inverted variants must fail; a shell exporting the arming variable must not regress the corrected binary. Not rehearsed: a regression that computes a wrong state without throwing, one that throws the recoverable kind and retries, one at the ingress.'
      cleanup: 'bin/delivery-regression-smoke.sh takes a per-schema lock, resets the reserved schema before the run and drops it and the queues after, unsuccessful runs included; the reaction is inert outside the rehearsal, the variable unset.'
